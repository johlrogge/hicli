[workspace]
members = [".", "macros"]

# Shared by both crates so the lint policy is stated once. Each member opts in
# with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[package]
name = "hicli"
version = "0.3.0"
edition = "2021"
# `#[group]` on a file-module declaration needs attribute macros on non-inline
# modules, stable since 1.99 (ADR-010).
rust-version = "1.99"
description = "CLI-enable your code: a subcommand is a documented function, a group of subcommands is a documented module whose children are discovered, an argument is a type — and there is no hand-written dispatch match. Built on bpaf, with first-class in-process testing, git-style external subcommands, and typo suggestions."
license = "MIT OR Apache-2.0"
repository = "https://github.com/johlrogge/hicli"
readme = "README.md"
keywords = ["cli", "subcommand", "bpaf", "argument", "parser"]
categories = ["command-line-interface"]
# Development tooling (agent config, devenv, task runner, workflow docs) and the
# promo site are not part of the published crate.
exclude = [
  "site/",
  ".github/",
  ".claude/",
  "claude/",
  ".mcp.json",
  "CLAUDE.md",
  "devenv.*",
  "justfile",
  "RELEASING.md",
  "ROADMAP.md",
  "docs/sketches/",
]

[features]
default = ["color"]
# Coloured help and errors from `App::run` (ADR-015). Forwards `bpaf/color`, not
# `bpaf/dull-color`: bpaf's `Color::default` lets `dull-color` win whenever it is
# on, so forwarding it would silently override a consumer's own
# `bpaf = { version = "0.9", features = ["bright-color"] }`.
color = ["bpaf/color"]

[dependencies]
bpaf = { version = "0.9.27", features = ["derive", "autocomplete"] }
strsim = "0.11"
# Exact-pinned: `#[command]` expands to calls into this crate's
# private-by-contract expansion shape, so the two versions move together and are
# published together (macros first).
hicli-macros = { version = "=0.3.0", path = "macros" }

[dev-dependencies]
# UI tests for `#[command]`'s rejections: a compile error is part of the macro's
# contract, so it is asserted like any other behaviour.
trybuild = "1"
# ADR-012: a command returning `anyhow::Result` / `eyre::Result` works through
# `Into<Failure>` with no feature and no dependency of hicli's own; these
# prove it end to end (`tests/errors.rs`).
anyhow = "1"
eyre = "0.6"
# `examples/playr.rs` shows a command returning `color_eyre::Result` (README).
# It uses only `Result` and `WrapErr`, so the span-trace defaults stay off.
color-eyre = { version = "0.6", default-features = false }

[lints]
workspace = true

[[example]]
name = "demo"
path = "examples/demo.rs"

# The same CLI shape with its groups in files rather than inline. A directory
# example needs its path stated, because cargo's auto-discovery only globs
# `examples/*.rs`.
[[example]]
name = "files"
path = "examples/files/main.rs"

# The README's running example, and its Quick start. `test = true` so
# `cargo test --workspace` runs the tests inside them: playr's tests are the
# README's Testing section, and playr_minimal's checks that the Quick start's
# pasted `--help` output is what the app prints.
[[example]]
name = "playr"
path = "examples/playr.rs"
test = true

[[example]]
name = "playr_minimal"
path = "examples/playr_minimal.rs"
test = true
