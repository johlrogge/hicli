[package]
name = "hicli-macros"
version = "0.1.0"
edition = "2021"
# Matches `hicli`'s: `group_mod!` reads `proc_macro::Span::local_file`,
# stable since 1.88 (ADR-005 §5).
rust-version = "1.88"
description = "Procedural macros for hicli: `#[command]` (a documented function is a subcommand), `#[group]` and `group_mod!` (a documented module is a group, its children discovered), `commands!` and `#[derive(Arg)]`. Use the `hicli` crate, which re-exports them."
license = "MIT OR Apache-2.0"
repository = "https://github.com/johlrogge/hicli"
# The workspace README: this crate has no standalone story, and pointing at the
# same file keeps the two crates.io pages telling one story.
readme = "../README.md"
keywords = ["cli", "subcommand", "bpaf", "macro", "parser"]
categories = ["command-line-interface", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[lints]
workspace = true
